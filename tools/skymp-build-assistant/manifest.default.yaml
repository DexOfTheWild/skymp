# Default artifact manifest for SkyMP Build Assistant.
# Paths use ${variable} placeholders expanded from user config (.skymp-dev.yaml) and environment.
#
# Resolved variables:
#   repoRoot          - repository root (parent of tools/ when run from repo)
#   buildDir          - cmake build dir, default ${repoRoot}/build
#   skyrimRoot        - Skyrim SE root (folder containing SkyrimSE.exe); from config or SKYRIM_DIR
#   skyrimPlatformDir - ${skyrimRoot}/Data/Platform
#   skyrimDataDir     - ${skyrimRoot}/Data
#   nirnLabOutputDir  - NirnLab build output root (contains Data/SKSE/Plugins, Data/NirnLabUIPlatform)

version: 1

variables:
  buildDir: "${repoRoot}/build"
  nirnLabOutputSibling: "${repoParent}/NirnLabUIPlatform/build/dist/Release"
  nirnLabOutputInRepo: "${repoRoot}/NirnLabUIPlatform/build/dist/Release"

# Addon-owned assistant metadata is discovered at runtime from
# skymp5-addons/*/skymp-addon.json and merged with this base manifest.
artifacts:
  - id: skymp5-client-js
    label: skymp5-client plugin
    producer: skymp5-client (webpack via CMake)
    kind: file
    requiresSkyrim: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Plugins/skymp5-client.js"
    destinations:
      - path: "${skyrimPlatformDir}/Plugins/skymp5-client.js"

  - id: skymp5-client-settings
    label: skymp5-client settings
    producer: generate_client_settings.cmake
    kind: file
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Plugins/skymp5-client-settings.txt"
    destinations:
      - path: "${skyrimPlatformDir}/Plugins/skymp5-client-settings.txt"

  - id: platform-ui
    label: Platform UI bundle directory
    producer: skymp5-front / addon UI assets
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/UI"
    destinations:
      - path: "${skyrimPlatformDir}/UI"

  - id: platform-distribution
    label: Platform distribution directory
    producer: skyrim-platform/tools/dev_service pack
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Distribution"
    destinations:
      - path: "${skyrimPlatformDir}/Distribution"

  - id: platform-fonts
    label: Platform fonts directory
    producer: skymp5-front / skyrim-platform packaging
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Fonts"
    destinations:
      - path: "${skyrimPlatformDir}/Fonts"

  - id: platform-modules
    label: Platform modules directory
    producer: skyrim-platform packaging
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Modules"
    destinations:
      - path: "${skyrimPlatformDir}/Modules"

  - id: interface-assets
    label: Interface assets
    producer: client / platform packaging
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Interface"
    destinations:
      - path: "${skyrimDataDir}/Interface"

  - id: papyrus-scripts
    label: Papyrus scripts
    producer: skyrim-platform / client packaging
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Scripts"
    destinations:
      - path: "${skyrimDataDir}/Scripts"

  - id: gamemode-server-copy-a
    label: gamemode.js (server dist)
    producer: skymp5-gamemode source
    kind: file
    optional: true
    sources:
      - path: "${repoRoot}/skymp5-gamemode/gamemode.js"
    destinations:
      - path: "${buildDir}/dist/server/gamemode.js"

  - id: gamemode-server-copy-b
    label: gamemode.js (nested server path)
    producer: skymp5-gamemode source
    kind: file
    optional: true
    sources:
      - path: "${repoRoot}/skymp5-gamemode/gamemode.js"
    destinations:
      - path: "${buildDir}/dist/server/skymp5-gamemode/gamemode.js"

  - id: skyrim-platform-dll-dist
    label: SkyrimPlatform.dll -> dist mirror
    producer: skyrim-platform (MSVC)
    kind: file
    optional: true
    sources:
      - path: "${buildDir}/skyrim-platform/_platform_se/bin/Release/SkyrimPlatform.dll"
    destinations:
      - path: "${buildDir}/dist/client/Data/SKSE/Plugins/SkyrimPlatform.dll"

  - id: mp-client-plugin-game
    label: MpClientPlugin.dll -> game
    producer: skyrim-platform/tools/dev_service pack
    kind: file
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/SKSE/Plugins/MpClientPlugin.dll"
    destinations:
      - path: "${skyrimDataDir}/SKSE/Plugins/MpClientPlugin.dll"

  - id: skyrim-platform-dll-game
    label: SkyrimPlatform.dll -> game
    producer: skyrim-platform (MSVC)
    kind: file
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/skyrim-platform/_platform_se/bin/Release/SkyrimPlatform.dll"
    destinations:
      - path: "${skyrimDataDir}/SKSE/Plugins/SkyrimPlatform.dll"

  - id: skyrim-platform-ini-game
    label: SkyrimPlatform.ini -> game
    producer: skyrim-platform/tools/dev_service pack
    kind: file
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/SKSE/Plugins/SkyrimPlatform.ini"
    destinations:
      - path: "${skyrimDataDir}/SKSE/Plugins/SkyrimPlatform.ini"

  - id: skyrim-platform-runtime-game
    label: Skyrim Platform runtime dependencies -> game
    producer: skyrim-platform/tools/dev_service pack
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${buildDir}/dist/client/Data/Platform/Distribution/RuntimeDependencies"
    destinations:
      - path: "${skyrimPlatformDir}/Distribution/RuntimeDependencies"

  - id: nirnlab-plugin-dist
    label: NirnLab UI plugin -> dist mirror
    producer: NirnLabUIPlatform build
    kind: file
    optional: true
    sources:
      - path: "${nirnLabOutputDir}/Data/SKSE/Plugins/NirnLabUIPlugin.dll"
    destinations:
      - path: "${buildDir}/dist/client/Data/SKSE/Plugins/NirnLabUIPlugin.dll"

  - id: nirnlab-plugin-game
    label: NirnLab UI plugin -> game
    producer: NirnLabUIPlatform build
    kind: file
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${nirnLabOutputDir}/Data/SKSE/Plugins/NirnLabUIPlugin.dll"
    destinations:
      - path: "${skyrimDataDir}/SKSE/Plugins/NirnLabUIPlugin.dll"

  - id: nirnlab-ui-dist
    label: NirnLab UI runtime -> dist mirror
    producer: NirnLabUIPlatform build
    kind: directory
    optional: true
    sources:
      - path: "${nirnLabOutputDir}/Data/NirnLabUIPlatform"
    destinations:
      - path: "${buildDir}/dist/client/Data/NirnLabUIPlatform"

  - id: nirnlab-ui-game
    label: NirnLab UI runtime -> game
    producer: NirnLabUIPlatform build
    kind: directory
    requiresSkyrim: true
    optional: true
    sources:
      - path: "${nirnLabOutputDir}/Data/NirnLabUIPlatform"
    destinations:
      - path: "${skyrimDataDir}/NirnLabUIPlatform"

warnings:
  - id: pluginsdev-client-override
    path: "${skyrimPlatformDir}/PluginsDev/skymp5-client.js"
    message: "A copy in PluginsDev can override the normal client plugin during testing. Remove if stale."
    severity: warn
